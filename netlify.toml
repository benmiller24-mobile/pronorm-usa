[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Astro 7 requires Node >= 22.23.4 — pin it so Netlify never builds with an older default.
[build.environment]
  NODE_VERSION = "22.23.4"

[functions]
  node_bundler = "esbuild"

# --- 301 Redirects for broken links (audit fix) ---

[[redirects]]
  from = "/equipment"
  to = "/product-lines/equipment"
  status = 301

[[redirects]]
  from = "/magazine/handleless-kitchen-design"
  to = "/magazine"
  status = 301

[[redirects]]
  from = "/magazine/kitchen-island-design-guide"
  to = "/magazine"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/why-pronorm/german-vs-american"
  to = "/magazine/german-vs-american-kitchens"
  status = 301
# Sitemaps: /sitemap.xml is a real file (copied from sitemap-index.xml at
# build time — see astro.config.mjs). Never 301 a sitemap; 200-rewrite the
# legacy underscore spelling instead.
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap-index.xml"
  status = 200
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-0.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

# --- Catch-all 404 (must be last) ---

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://*.netlify.app; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.supabase.co; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; upgrade-insecure-requests"

# HTML pages - don't cache, always serve fresh
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed JS/CSS assets - cache long but Astro generates new hashes per build
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images - cache for 30 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Videos - cache for 30 days
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# PDF downloads - cache for 7 days
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Fonts - cache for 1 year
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
